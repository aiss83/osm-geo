[package]
name = "osm-geo"
version = "0.2.0"
edition = "2024"
description = "ETL-пайплайн для подготовки офлайн-базы геокодирования из OpenStreetMap"

[[bin]]
name = "inspect_pbf"
path = "src/bin/inspect_pbf.rs"

[features]
default = []
neural-normalizer = ["tract-onnx", "ndarray"]
neural-tokenizer = ["sentencepiece-rs"]

[dependencies]
# PBF parsing
osmpbf = "0.3"
# SQLite with FTS5
rusqlite = { version = "0.32", features = ["bundled", "vtab", "column_decltype"] }
# CLI
clap = { version = "4", features = ["derive"] }
# JSON (metadata export)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compression
zstd = "0.13"
# Gzip decompression
flate2 = "1"
# Hashing
sha2 = "0.10"
# HTTP client (download)
reqwest = { version = "0.12", features = ["blocking"] }
# Russian stemming
rust-stemmers = "1"
# Spell correction (SymSpell)
symspell = "0.5"
# HTML parsing
regex-lite = "0.1"
# Error handling
anyhow = "1"
# Progress bars
indicatif = "0.17"
# Logging
log = "0.4"
env_logger = "0.11"
# ONNX Runtime на чистом Rust (tract, без системных библиотек)
tract-onnx = { version = "0.23", optional = true }
# SentencePiece токенизатор (pure Rust, без C++ зависимостей)
sentencepiece-rs = { version = "0.2", optional = true }
# ndarray для тензорных операций в ONNX инференсе
ndarray = { version = "0.15", optional = true }